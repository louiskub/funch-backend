apiVersion: batch/v1
kind: Job
metadata:
  name: funch-db-migrate
  namespace: funch-backend
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: migrate
          image: ghcr.io/louiskub/funch-backend:latest
          command:
            - node
            - ./node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/platform/database/typeorm-data-source.js
          envFrom:
            - secretRef:
                name: funch-backend-env
